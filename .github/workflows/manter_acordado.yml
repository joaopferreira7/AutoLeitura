# Visita o app publicado a cada 6 horas para ele não dormir (e o acorda se tiver dormido).
# Também dá para rodar na mão em Actions > Manter o app acordado > Run workflow, antes da apresentação.
name: Manter o app acordado

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Navegador
        run: pip install playwright && playwright install --with-deps chromium
      - name: Abrir o app
        run: python scripts/acordar_app.py https://autoleitura.streamlit.app
